version: '3.8'

services:
  universalproductscraper:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5020:5020"
    environment:
      - ASPNETCORE_URLS=http://+:5020
      - REMOTE_BROWSER_URL=http://selenium-chrome:4444/wd/hub
    depends_on:
      - selenium-chrome

  selenium-chrome:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
    shm_size: '1gb'

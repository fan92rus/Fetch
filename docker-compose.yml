version: '3.8'

services:
  fetch-server:
    image: ghcr.io/fan92rus/fetch:latest
    ports:
      - "5020:5020"
    environment:
      # TRAWL вместо FlareSolverr: тот же FlareSolverr v2-совместимый контракт
      # (POST {url}/v1, cmd=request.get -> status ok + solution.response).
      # Требует внешнюю сеть relampa_default, где живёт trawl (CT100).
      - FLARESOLVERR_URL=http://trawl:8191
    restart: unless-stopped
    networks:
      - proxy
      - default
      - relampa_default
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true
  default:
    driver: bridge
  relampa_default:
    external: true

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    restart: unless-stopped

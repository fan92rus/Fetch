name: CI/CD

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Authenticate GitHub Packages
        run: dotnet nuget update source github --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  publish-packages:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Authenticate GitHub Packages
        run: dotnet nuget update source github --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - name: Pack and push new versions
        run: |
          publish_if_new() {
            csproj="$1"
            pkg=$(basename "$csproj" .csproj)
            ver=$(grep -oP '(?<=<Version>)[^<]+' "$csproj")
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              "https://nuget.pkg.github.com/${{ github.repository_owner }}/download/${pkg}/${ver}/${pkg}.${ver}.nupkg")
            if [ "$status" = "200" ]; then
              echo "⏭ $pkg $ver already published"
            else
              echo "📦 Packing $pkg $ver"
              dotnet pack "$csproj" -c Release -o ./nupkgs
            fi
          }

          publish_if_new "Funny.WebScrape.Core/Funny.WebScrape.Core.csproj"
          publish_if_new "Funny.WebScrape/Funny.WebScrape.csproj"
          publish_if_new "Fetch.Cli/Fetch.Cli.csproj"

          if ls ./nupkgs/*.nupkg 1>/dev/null 2>&1; then
            dotnet nuget push ./nupkgs/*.nupkg --source github --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          else
            echo "No new packages to publish"
          fi
